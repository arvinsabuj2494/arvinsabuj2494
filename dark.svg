<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1180 610" width="1180" height="610" role="img" aria-label="Arvin Sabuj - Software Engineer">
  <defs>
    <!-- Dynamic Glowing Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="33%" stop-color="#818CF8"/>
      <stop offset="66%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#F43F5E"/>
    </linearGradient>

    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <clipPath id="avatarClip">
      <rect x="70" y="140" width="340" height="290" rx="16"/>
    </clipPath>

    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      
      /* Glowing Text Effects */
      .title { font-size: 32px; font-weight: 800; fill: #F8FAFC; letter-spacing: -0.5px; }
      .sub { font-size: 16px; font-weight: 700; fill: #38BDF8; }
      .label { font-size: 13px; font-weight: 700; fill: #818CF8; }
      .value { font-size: 13px; font-weight: 500; fill: #F1F5F9; }
      .pill-text { font-size: 12px; font-weight: 700; fill: #38BDF8; }

      /* SMIL Fallback & Animations */
      @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
      .cursor { animation: blink 1s infinite; fill: #38BDF8; }

      @keyframes floatPill {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-3px); }
      }
      .float-1 { animation: floatPill 3s ease-in-out infinite; }
      .float-2 { animation: floatPill 4s ease-in-out infinite 0.5s; }
      .float-3 { animation: floatPill 3.5s ease-in-out infinite 1s; }

      @keyframes scanline {
        0% { transform: translateY(0px); opacity: 0; }
        50% { opacity: 0.5; }
        100% { transform: translateY(280px); opacity: 0; }
      }
      .scan { animation: scanline 4s linear infinite; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1180" height="610" rx="20" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="2"/>

  <!-- Glowing Border Animation -->
  <rect x="2" y="2" width="1176" height="606" rx="18" fill="none" stroke="url(#neonGrad)" stroke-width="2" opacity="0.6">
    <animate attributeName="opacity" values="0.3;0.8;0.3" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- Top Terminal Bar -->
  <rect x="20" y="20" width="1140" height="40" rx="10" fill="#090D16" stroke="#1E293B"/>
  <circle cx="45" cy="40" r="6" fill="#FF5F56"/>
  <circle cx="65" cy="40" r="6" fill="#FFBD2E"/>
  <circle cx="85" cy="40" r="6" fill="#27C93F"/>
  <text x="110" y="45" class="mono" font-size="13" fill="#64748B">arvin@developer-workstation:~ (zsh)</text>
  
  <g transform="translate(1040, 28)">
    <rect width="100" height="24" rx="12" fill="#064E3B" stroke="#10B981"/>
    <circle cx="16" cy="12" r="4" fill="#34D399">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <text x="28" y="16" class="mono" font-size="11" fill="#34D399" font-weight="bold">SYSTEM OK</text>
  </g>

  <!-- LEFT PANEL - PORTRAIT -->
  <rect x="30" y="80" width="420" height="500" rx="14" fill="#0B132B" stroke="#1E293B" opacity="0.9"/>
  <text x="50" y="115" class="mono" font-size="12" fill="#38BDF8" font-weight="bold">&gt; SYSTEM.USER_AVATAR</text>

  <!-- Real HD Photo Container with Cyber Glow -->
  <g>
    <rect x="68" y="138" width="344" height="294" rx="18" fill="none" stroke="url(#neonGrad)" stroke-width="3"/>
    <image xlink:href="./photo.png" x="70" y="140" width="340" height="290" preserveAspectRatio="xMidYMin slice" clip-path="url(#avatarClip)"/>
    
    <!-- Animated Scanline over Photo -->
    <rect class="scan" x="70" y="140" width="340" height="4" fill="#38BDF8" clip-path="url(#avatarClip)"/>
  </g>

  <!-- Status Box -->
  <rect x="50" y="450" width="380" height="110" rx="10" fill="#030712" stroke="#1E293B"/>
  <text x="70" y="480" class="mono" font-size="13" fill="#F43F5E" font-weight="bold">&gt; status --current</text>
  <text x="70" y="505" class="mono" font-size="12" fill="#38BDF8">⚡ Building High-Scalability Systems</text>
  <text x="70" y="530" class="mono" font-size="12" fill="#94A3B8">🎓 CS Student @ UMGC</text>

  <!-- RIGHT PANEL - SYSTEM INFO -->
  <rect x="470" y="80" width="680" height="500" rx="14" fill="#0B132B" stroke="#1E293B" opacity="0.9"/>
  
  <!-- Animated Title -->
  <text x="500" y="130" class="mono title">Arvin Sabuj</text>
  <text x="500" y="160" class="mono sub">&gt; Full-Stack Software Engineer</text>
  <rect x="500" y="175" width="620" height="2" fill="url(#neonGrad)"/>

  <!-- Info Grid -->
  <g transform="translate(500, 205)">
    <g transform="translate(0, 0)">
      <text x="0" y="15" class="mono label">&gt; ROLE</text>
      <text x="140" y="15" class="mono value" fill="#F8FAFC">Software Engineer &amp; Full-Stack Builder</text>
    </g>

    <g transform="translate(0, 35)">
      <text x="0" y="15" class="mono label">&gt; EDUCATION</text>
      <text x="140" y="15" class="mono value" fill="#F8FAFC">B.S. Computer Science @ UMGC</text>
    </g>

    <g transform="translate(0, 70)">
      <text x="0" y="15" class="mono label">&gt; EMAIL</text>
      <text x="140" y="15" class="mono value" fill="#38BDF8">asabuj@student.umgc.edu</text>
    </g>

    <g transform="translate(0, 105)">
      <text x="0" y="15" class="mono label">&gt; FOCUS</text>
      <text x="140" y="15" class="mono value" fill="#F8FAFC">Web Applications, Microservices &amp; REST APIs</text>
    </g>
  </g>

  <!-- Animated Tech Stack Pills -->
  <text x="500" y="365" class="mono" font-size="14" fill="#F8FAFC" font-weight="bold">&gt; TECH_STACK_MODULES</text>
  
  <g transform="translate(500, 385)">
    <!-- Row 1 -->
    <g class="float-1">
      <rect x="0" y="0" width="115" height="34" rx="8" fill="url(#pillGrad)" stroke="#38BDF8" stroke-width="1.5"/>
      <circle cx="15" cy="17" r="4" fill="#F7DF1E"/>
      <text x="26" y="22" class="mono pill-text" fill="#F8FAFC">JavaScript</text>
    </g>

    <g class="float-2">
      <rect x="125" y="0" width="115" height="34" rx="8" fill="url(#pillGrad)" stroke="#3178C6" stroke-width="1.5"/>
      <circle cx="140" cy="17" r="4" fill="#3178C6"/>
      <text x="151" y="22" class="mono pill-text" fill="#F8FAFC">TypeScript</text>
    </g>

    <g class="float-3">
      <rect x="250" y="0" width="95" height="34" rx="8" fill="url(#pillGrad)" stroke="#61DAFB" stroke-width="1.5"/>
      <circle cx="265" cy="17" r="4" fill="#61DAFB"/>
      <text x="276" y="22" class="mono pill-text" fill="#F8FAFC">React</text>
    </g>

    <g class="float-1">
      <rect x="355" y="0" width="95" height="34" rx="8" fill="url(#pillGrad)" stroke="#339933" stroke-width="1.5"/>
      <circle cx="370" cy="17" r="4" fill="#339933"/>
      <text x="381" y="22" class="mono pill-text" fill="#F8FAFC">Node.js</text>
    </g>

    <g class="float-2">
      <rect x="460" y="0" width="95" height="34" rx="8" fill="url(#pillGrad)" stroke="#3776AB" stroke-width="1.5"/>
      <circle cx="475" cy="17" r="4" fill="#3776AB"/>
      <text x="486" y="22" class="mono pill-text" fill="#F8FAFC">Python</text>
    </g>

    <!-- Row 2 -->
    <g class="float-3" transform="translate(0, 44)">
      <rect x="0" y="0" width="105" height="34" rx="8" fill="url(#pillGrad)" stroke="#06B6D4" stroke-width="1.5"/>
      <circle cx="15" cy="17" r="4" fill="#06B6D4"/>
      <text x="26" y="22" class="mono pill-text" fill="#F8FAFC">Tailwind</text>
    </g>

    <g class="float-1" transform="translate(0, 44)">
      <rect x="115" y="0" width="125" height="34" rx="8" fill="url(#pillGrad)" stroke="#4169E1" stroke-width="1.5"/>
      <circle cx="130" cy="17" r="4" fill="#4169E1"/>
      <text x="141" y="22" class="mono pill-text" fill="#F8FAFC">PostgreSQL</text>
    </g>

    <g class="float-2" transform="translate(0, 44)">
      <rect x="250" y="0" width="85" height="34" rx="8" fill="url(#pillGrad)" stroke="#F05032" stroke-width="1.5"/>
      <circle cx="265" cy="17" r="4" fill="#F05032"/>
      <text x="276" y="22" class="mono pill-text" fill="#F8FAFC">Git</text>
    </g>

    <g class="float-3" transform="translate(0, 44)">
      <rect x="345" y="0" width="115" height="34" rx="8" fill="url(#pillGrad)" stroke="#A855F7" stroke-width="1.5"/>
      <circle cx="360" cy="17" r="4" fill="#A855F7"/>
      <text x="371" y="22" class="mono pill-text" fill="#F8FAFC">REST API</text>
    </g>
  </g>

  <!-- Interactive Terminal Prompt Line -->
  <g transform="translate(500, 525)">
    <text x="0" y="0" class="mono" font-size="14" fill="#38BDF8" font-weight="bold">&gt; arvin.initEngine()</text>
    <rect x="180" y="-12" width="10" height="16" class="cursor"/>
  </g>
</svg>
