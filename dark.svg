<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 610" width="1180" height="610" role="img" aria-label="Arvin Sabuj Profile">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="50%" stop-color="#0B1220"/>
      <stop offset="100%" stop-color="#07111F"/>
    </linearGradient>

    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>

    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .title { font-size: 28px; font-weight: 700; fill: #F8FAFC; }
      .sub { font-size: 15px; fill: #38BDF8; font-weight: 600; }
      .label { font-size: 13px; fill: #94A3B8; font-weight: 600; }
      .value { font-size: 13px; fill: #E2E8F0; }
      .pill-text { font-size: 12px; fill: #38BDF8; font-weight: 600; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1180" height="610" rx="20" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="2"/>

  <!-- Top Terminal Bar -->
  <rect x="20" y="20" width="1140" height="40" rx="10" fill="#0F172A"/>
  <circle cx="45" cy="40" r="6" fill="#EF4444"/>
  <circle cx="65" cy="40" r="6" fill="#F59E0B"/>
  <circle cx="85" cy="40" r="6" fill="#10B981"/>
  <text x="110" y="44" class="mono" font-size="13" fill="#64748B">arvin@developer-workstation:~ (zsh)</text>
  <rect x="1050" y="30" width="90" height="20" rx="10" fill="#065F46"/>
  <text x="1063" y="44" class="mono" font-size="11" fill="#34D399" font-weight="bold">ONLINE</text>

  <!-- LEFT PANEL -->
  <rect x="30" y="80" width="420" height="500" rx="14" fill="url(#panelGrad)" stroke="#1E293B"/>
  <text x="50" y="115" class="mono" font-size="12" fill="#64748B">&gt; VISUAL.PROFILE</text>

  <!-- High-Precision Vector Silhouette Art -->
  <g transform="translate(140, 140)">
    <!-- Head Outline -->
    <path d="M 60,10 C 90,10 100,30 100,50 C 100,60 95,70 85,85 C 80,92 78,100 85,110 C 90,118 80,125 70,120 C 60,115 50,130 50,145 C 50,150 40,150 30,160 L 0,180 L 140,180 C 120,150 110,130 110,100 C 110,40 90,10 60,10 Z" fill="none" stroke="#38BDF8" stroke-width="3" stroke-dasharray="4 4"/>
    <ellipse cx="70" cy="55" rx="35" ry="45" fill="#0F172A" stroke="#38BDF8" stroke-width="2"/>
    <path d="M 35,100 C 35,100 60,130 70,160 C 80,130 105,100 105,100" fill="none" stroke="#818CF8" stroke-width="2"/>
  </g>

  <rect x="50" y="450" width="380" height="110" rx="10" fill="#020617" stroke="#1E293B"/>
  <text x="70" y="480" class="mono" font-size="13" fill="#38BDF8">&gt; status --current</text>
  <text x="70" y="505" class="mono" font-size="12" fill="#94A3B8">Building web apps &amp; systems</text>
  <text x="70" y="530" class="mono" font-size="12" fill="#64748B">CS Student @ UMGC</text>

  <!-- RIGHT PANEL -->
  <rect x="470" y="80" width="680" height="500" rx="14" fill="url(#panelGrad)" stroke="#1E293B"/>
  
  <text x="500" y="125" class="mono title">Arvin Sabuj</text>
  <text x="500" y="155" class="mono sub">Software Engineer · Full-Stack Developer</text>
  <rect x="500" y="170" width="620" height="2" fill="url(#accentGrad)"/>

  <!-- Info Grid -->
  <g transform="translate(500, 200)">
    <text x="0" y="20" class="mono label">&gt; ROLE</text>
    <text x="140" y="20" class="mono value">Full-Stack Software Developer</text>

    <text x="0" y="50" class="mono label">&gt; EDUCATION</text>
    <text x="140" y="50" class="mono value">B.S. Computer Science @ UMGC</text>

    <text x="0" y="80" class="mono label">&gt; EMAIL</text>
    <text x="140" y="80" class="mono value">asabuj@student.umgc.edu</text>

    <text x="0" y="110" class="mono label">&gt; FOCUS</text>
    <text x="140" y="110" class="mono value">Web Applications, System Architecture &amp; APIs</text>
  </g>

  <!-- Tech Stack -->
  <text x="500" y="360" class="mono" font-size="14" fill="#F8FAFC" font-weight="bold">&gt; TECH_STACK</text>
  
  <g transform="translate(500, 380)">
    <!-- Row 1 -->
    <rect x="0" y="0" width="110" height="32" rx="6" fill="#1E293B" stroke="#334155"/>
    <text x="18" y="20" class="mono pill-text">JavaScript</text>
    
    <rect x="120" y="0" width="110" height="32" rx="6" fill="#1E293B" stroke="#334155"/>
    <text x="138" y="20" class="mono pill-text">TypeScript</text>
    
    <rect x="240" y="0" width="90" height="32" rx="6" fill="#1E293B" stroke="#334155"/>
    <text x="262" y="20" class="mono pill-text">React</text>
    
    <rect x="340" y="0" width="90" height="32" rx="6" fill="#1E293B" stroke="#334155"/>
    <text x="355" y="20" class="mono pill-text">Node.js</text>

    <rect x="440" y="0" width="90" height="32" rx="6" fill="#1E293B" stroke="#334155"/>
    <text x="458" y="20" class="mono pill-text">Python</text>

    <!-- Row 2 -->
    <rect x="0" y="42" width="100" height="32" rx="6" fill="#1E293B" stroke="#334155"/>
    <text x="18" y="62" class="mono pill-text">Tailwind</text>
    
    <rect x="110" y="42" width="110" height="32" rx="6" fill="#1E293B" stroke="#334155"/>
    <text x="125" y="62" class="mono pill-text">PostgreSQL</text>
    
    <rect x="230" y="42" width="80" height="32" rx="6" fill="#1E293B" stroke="#334155"/>
    <text x="255" y="62" class="mono pill-text">Git</text>

    <rect x="320" y="42" width="100" height="32" rx="6" fill="#1E293B" stroke="#334155"/>
    <text x="338" y="62" class="mono pill-text">REST API</text>
  </g>

  <!-- Prompt -->
  <g transform="translate(500, 520)">
    <text x="0" y="0" class="mono" font-size="13" fill="#38BDF8">&gt; arvin.getContactDetails()</text>
  </g>
</svg>
