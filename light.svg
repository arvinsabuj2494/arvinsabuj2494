<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 610" width="1180" height="610" role="img" aria-label="Arvin Sabuj Profile">
  <defs>
    <linearGradient id="bgGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>

    <linearGradient id="panelGradLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>

    <linearGradient id="accentGradLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#9333EA"/>
    </linearGradient>

    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .title { font-size: 28px; font-weight: 700; fill: #0F172A; }
      .sub { font-size: 15px; fill: #0284C7; font-weight: 600; }
      .label { font-size: 13px; fill: #64748B; font-weight: 600; }
      .value { font-size: 13px; fill: #1E293B; }
      .pill-text { font-size: 12px; fill: #0369A1; font-weight: 600; }
      .ascii-art { font-size: 8px; fill: #0284C7; letter-spacing: 1px; line-height: 1.0; font-weight: bold; }
    </style>
  </defs>

  <rect width="1180" height="610" rx="20" fill="url(#bgGradLight)" stroke="#CBD5E1" stroke-width="2"/>

  <!-- Top Bar -->
