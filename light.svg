<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 610" width="1180" height="610" role="img" aria-label="Arvin Sabuj - Software Engineer Portfolio">
  <defs>
    <linearGradient id="bgGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>

    <linearGradient id="panelGradLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#F8FAFC" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="accentGradLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#9333EA"/>
    </linearGradient>

    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .title { font-size: 28px; font-weight: 700; fill: #0F172A; }
      .sub { font-size: 15px; fill: #0284C7; font-weight: 600; }
      .label { font-size: 13px; fill: #64748B; font-weight: 600; }
      .value { font-size: 13px; fill: #1E293B; }
      .ascii { font-size: 10px; fill: #0284C7; letter-spacing: 2px; white-space: pre; }
      .pill { fill: #F1F5F9; stroke: #CBD5E1; rx: 6px; }
      .pill-text { font-size: 12px; fill: #0369A1; font-weight: 600; }
      
      @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
      .cursor { animation: blink 1s infinite; fill: #0284C7; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1180" height="610" rx="20" fill="url(#bgGradLight)" stroke="#CBD5E1" stroke-width="2"/>

  <!-- Top Terminal Bar -->
  <rect x="20" y="20" width="1140" height="40" rx="10" fill="#E2E8F0"/>
  <circle cx="45" cy="40" r="6" fill="#EF4444"/>
  <circle cx="65" cy="40" r="6" fill="#F59E0B"/>
  <circle cx="85" cy="40" r="6" fill="#10B981"/>
  <text x="110" y="44" class="mono" font-size="13" fill="#475569">arvin@developer-workstation:~ (zsh)</text>
  <rect x="1050" y="30" width="90" height="20" rx="10" fill="#D1FAE5"/>
  <text x="1063" y="44" class="mono" font-size="11" fill="#047857" font-weight="bold">ONLINE</text>

  <!-- LEFT PANEL - VISUAL ASCII ART -->
  <rect x="30" y="80" width="420" height="500" rx="14" fill="url(#panelGradLight)" stroke="#CBD5E1"/>
  <text x="50" y="115" class="mono" font-size="12" fill="#64748B">&gt; VISUAL.PROFILE</text>

  <!-- ASCII Silhouette based on uploaded image -->
  <text x="75" y="150" class="mono ascii">
          . : + * # # # % @
      . : + * # # # # # # % @
    . : + * # # # # # # # # % @
    : + * # # # # # # # # # # %
    : + * # # # # # # # # # # %
      . : + * # # # # # # # # % @
          . : + * # # # # # # # % @
              . : + * # # # # # # %
                . : + * # # # # # % @
                  : + * # # # # # # %
                  : + * # # # # # # %
                  : + * # # # # # # %
                . : + * # # # # # # % @
                : + * # # # # # # # # %
              . : + * # # # # # # # # % @
          . : + * # # # # # # # # # # # % @
      . : + * # # # # # # # # # # # # # # %
  </text>

  <rect x="50" y="450" width="380" height="110" rx="10" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="70" y="480" class="mono" font-size="13" fill="#0284C7">&gt; status --current</text>
  <text x="70" y="505" class="mono" font-size="12" fill="#475569">Building web apps &amp; systems</text>
  <text x="70" y="530" class="mono" font-size="12" fill="#64748B">CS Student @ UMGC</text>

  <!-- RIGHT PANEL - SYSTEM INFO -->
  <rect x="470" y="80" width="680" height="500" rx="14" fill="url(#panelGradLight)" stroke="#CBD5E1"/>
  
  <text x="500" y="125" class="mono title">Arvin Sabuj</text>
  <text x="500" y="155" class="mono sub">Software Engineer · Full-Stack Developer</text>
  <rect x="500" y="170" width="620" height="2" fill="url(#accentGradLight)"/>

  <!-- Info Grid -->
  <g transform="translate(500, 200)">
    <text x="0" y="20" class="mono label">&gt; ROLE</text>
    <text x="140" y="20" class="mono value">Full-Stack Software Developer</text>

    <text x="0" y="50" class="mono label">&gt; EDUCATION</text>
    <text x="140" y="50" class="mono value">B.S. Computer Science @ UMGC</text>

    <text x="0" y="80" class="mono label">&gt; EMAIL</text>
    <text x="140" y="80" class="mono value">asabuj@student.umgc.edu</text>

    <text x="0" y="110" class="mono label">&gt; FOCUS</text>
    <text x="140" y="110" class="mono value">Web Applications, System Architecture &amp; APIs</text>
  </g>

  <!-- Tech Stack Grid -->
  <text x="500" y="360" class="mono" font-size="14" fill="#0F172A" font-weight="bold">&gt; TECH_STACK</text>
  
  <g transform="translate(500, 380)">
    <rect x="0" y="0" width="110" height="32" class="pill"/>
    <text x="15" y="20" class="mono pill-text">JavaScript</text>
    <rect x="120" y="0" width="110" height="32" class="pill"/>
    <text x="135" y="20" class="mono pill-text">TypeScript</text>
    <rect x="240" y="0" width="90" height="32" class="pill"/>
    <text x="255" y="20" class="mono pill-text">React</text>
    <rect x="340" y="0" width="90" height="32" class="pill"/>
    <text x="355" y="20" class="mono pill-text">Node.js</text>
    <rect x="440" y="0" width="90" height="32" class="pill"/>
    <text x="455" y="20" class="mono pill-text">Python</text>

    <rect x="0" y="42" width="90" height="32" class="pill"/>
    <text x="15" y="62" class="mono pill-text">HTML/CSS</text>
    <rect x="100" y="42" width="100" height="32" class="pill"/>
    <text x="115" y="62" class="mono pill-text">Tailwind</text>
    <rect x="210" y="42" width="110" height="32" class="pill"/>
    <text x="225" y="62" class="mono pill-text">PostgreSQL</text>
    <rect x="330" y="42" width="80" height="32" class="pill"/>
    <text x="345" y="62" class="mono pill-text">Git</text>
    <rect x="420" y="42" width="90" height="32" class="pill"/>
    <text x="435" y="62" class="mono pill-text">REST API</text>
  </g>

  <!-- Terminal Prompt -->
  <g transform="translate(500, 520)">
    <text x="0" y="0" class="mono" font-size="13" fill="#0284C7">&gt; arvin.getContactDetails()</text>
    <rect x="225" y="-12" width="8" height="15" class="cursor"/>
  </g>
</svg>
