<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 610" width="1180" height="610" role="img" aria-label="Arvin Sabuj Portfolio">
  <defs>
    <linearGradient id="bgGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>

    <linearGradient id="neonGradLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="33%" stop-color="#6366F1"/>
      <stop offset="66%" stop-color="#9333EA"/>
      <stop offset="100%" stop-color="#E11D48"/>
    </linearGradient>

    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .title { font-size: 32px; font-weight: 800; fill: #0F172A; letter-spacing: -0.5px; }
      .sub { font-size: 16px; font-weight: 700; fill: #0284C7; }
      .label { font-size: 13px; font-weight: 700; fill: #4F46E5; }
      .value { font-size: 13px; font-weight: 600; fill: #1E293B; }
      .pill-text { font-size: 12px; font-weight: 700; fill: #0F172A; }

      @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
      .cursor { animation: blink 1s infinite; fill: #0284C7; }

      @keyframes floatPill {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-3px); }
      }
      .float-1 { animation: floatPill 3s ease-in-out infinite; }
      .float-2 { animation: floatPill 4s ease-in-out infinite 0.5s; }
      .float-3 { animation: floatPill 3.5s ease-in-out infinite 1s; }
    </style>
  </defs>

  <rect width="1180" height="610" rx="20" fill="url(#bgGradLight)" stroke="#CBD5E1" stroke-width="2"/>

  <!-- Glowing Outer Border -->
  <rect x="2" y="2" width="1176" height="606" rx="18" fill="none" stroke="url(#neonGradLight)" stroke-width="2" opacity="0.6">
    <animate attributeName="opacity" values="0.3;0.8;0.3" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- Top Terminal Bar -->
  <rect x="20" y="20" width="1140" height="40" rx="10" fill="#E2E8F0" stroke="#CBD5E1"/>
  <circle cx="45" cy="40" r="6" fill="#FF5F56"/>
  <circle cx="65" cy="40" r="6" fill="#FFBD2E"/>
  <circle cx="85" cy="40" r="6" fill="#27C93F"/>
  <text x="110" y="45" class="mono" font-size="13" fill="#475569">arvin@developer-workstation:~ (zsh)</text>

  <g transform="translate(1040, 28)">
    <rect width="100" height="24" rx="12" fill="#D1FAE5" stroke="#10B981"/>
    <circle cx="16" cy="12" r="4" fill="#059669">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <text x="28" y="16" class="mono" font-size="11" fill="#047857" font-weight="bold">SYSTEM OK</text>
  </g>

  <!-- LEFT PANEL -->
  <rect x="30" y="80" width="420" height="500" rx="14" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="50" y="115" class="mono" font-size="12" fill="#0284C7" font-weight="bold">&gt; SYSTEM.USER_AVATAR</text>

  <!-- Vector Avatar -->
  <g transform="translate(70, 138)">
    <rect width="340" height="290" rx="16" fill="#F8FAFC" stroke="url(#neonGradLight)" stroke-width="2"/>
    <g transform="translate(70, 30)">
      <path d="M 100,10 C 60,10 40,40 38,70 C 35,80 32,90 30,100 C 25,120 30,140 35,150 C 40,160 50,165 55,175 C 60,185 55,195 65,205 C 75,215 90,220 100,220 C 110,220 125,215 135,205 C 145,195 140,185 145,175 C 150,165 160,160 165,150 C 170,140 175,120 170,100 C 168,90 165,80 162,70 C 160,40 140,10 100,10 Z" fill="#E2E8F0" stroke="#0284C7" stroke-width="2.5"/>
      <path d="M 40,60 C 60,30 100,25 130,30 C 150,35 160,50 160,70 C 140,50 110,45 80,50 C 60,53 45,60 40,60 Z" fill="#0284C7" opacity="0.8"/>
      <path d="M 55,150 C 65,185 80,205 100,205 C 120,205 135,185 145,150 C 130,175 115,185 100,185 C 85,185 70,175 55,150 Z" fill="#6366F1"/>
      <path d="M 20,230 L 60,190 L 80,220 L 100,195 L 120,220 L 140,190 L 180,230 L 200,230 C 180,200 150,180 140,175 L 100,210 L 60,175 C 50,180 20,200 0,230 Z" fill="#CBD5E1" stroke="#9333EA" stroke-width="2"/>
    </g>
    <line x1="10" y1="20" x2="330" y2="20" stroke="#0284C7" stroke-width="2" opacity="0.7">
      <animateTransform attributeName="transform" type="translate" from="0,0" to="0,250" dur="3s" repeatCount="indefinite"/>
    </line>
  </g>

  <rect x="50" y="450" width="380" height="110" rx="10" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="70" y="480" class="mono" font-size="13" fill="#E11D48" font-weight="bold">&gt; status --current</text>
  <text x="70" y="505" class="mono" font-size="12" fill="#0284C7">⚡ Building High-Scalability Systems</text>
  <text x="70" y="530" class="mono" font-size="12" fill="#64748B">🎓 CS Student @ UMGC</text>

  <!-- RIGHT PANEL -->
  <rect x="470" y="80" width="680" height="500" rx="14" fill="#FFFFFF" stroke="#CBD5E1"/>
  
  <text x="500" y="130" class="mono title">Arvin Sabuj</text>
  <text x="500" y="160" class="mono sub">&gt; Full-Stack Software Engineer</text>
  <rect x="500" y="175" width="620" height="2" fill="url(#neonGradLight)"/>

  <!-- Info Grid -->
  <g transform="translate(500, 205)">
    <g transform="translate(0, 0)">
      <text x="0" y="15" class="mono label">&gt; ROLE</text>
      <text x="140" y="15" class="mono value">Software Engineer &amp; Full-Stack Builder</text>
    </g>

    <g transform="translate(0, 35)">
      <text x="0" y="15" class="mono label">&gt; EDUCATION</text>
      <text x="140" y="15" class="mono value">B.S. Computer Science @ UMGC</text>
    </g>

    <g transform="translate(0, 70)">
      <text x="0" y="15" class="mono label">&gt; EMAIL</text>
      <text x="140" y="15" class="mono value" fill="#0284C7">asabuj@student.umgc.edu</text>
    </g>

    <g transform="translate(0, 105)">
      <text x="0" y="15" class="mono label">&gt; FOCUS</text>
      <text x="140" y="15" class="mono value">Web Applications, Microservices &amp; REST APIs</text>
    </g>
  </g>

  <!-- Tech Stack Pills -->
  <text x="500" y="365" class="mono" font-size="14" fill="#0F172A" font-weight="bold">&gt; TECH_STACK_MODULES</text>
  
  <g transform="translate(500, 385)">
    <g class="float-1">
      <rect x="0" y="0" width="115" height="34" rx="8" fill="#F1F5F9" stroke="#38BDF8" stroke-width="1.5"/>
      <circle cx="15" cy="17" r="4" fill="#EAB308"/>
      <text x="26" y="22" class="mono pill-text">JavaScript</text>
    </g>

    <g class="float-2">
      <rect x="125" y="0" width="115" height="34" rx="8" fill="#F1F5F9" stroke="#3178C6" stroke-width="1.5"/>
      <circle cx="140" cy="17" r="4" fill="#3178C6"/>
      <text x="151" y="22" class="mono pill-text">TypeScript</text>
    </g>

    <g class="float-3">
      <rect x="250" y="0" width="95" height="34" rx="8" fill="#F1F5F9" stroke="#0284C7" stroke-width="1.5"/>
      <circle cx="265" cy="17" r="4" fill="#0284C7"/>
      <text x="276" y="22" class="mono pill-text">React</text>
    </g>

    <g class="float-1">
      <rect x="355" y="0" width="95" height="34" rx="8" fill="#F1F5F9" stroke="#16A34A" stroke-width="1.5"/>
      <circle cx="370" cy="17" r="4" fill="#16A34A"/>
      <text x="381" y="22" class="mono pill-text">Node.js</text>
    </g>

    <g class="float-2">
      <rect x="460" y="0" width="95" height="34" rx="8" fill="#F1F5F9" stroke="#2563EB" stroke-width="1.5"/>
      <circle cx="475" cy="17" r="4" fill="#2563EB"/>
      <text x="486" y="22" class="mono pill-text">Python</text>
    </g>

    <g class="float-3" transform="translate(0, 44)">
      <rect x="0" y="0" width="105" height="34" rx="8" fill="#F1F5F9" stroke="#0891B2" stroke-width="1.5"/>
      <circle cx="15" cy="17" r="4" fill="#0891B2"/>
      <text x="26" y="22" class="mono pill-text">Tailwind</text>
    </g>

    <g class="float-1" transform="translate(0, 44)">
      <rect x="115" y="0" width="125" height="34" rx="8" fill="#F1F5F9" stroke="#2563EB" stroke-width="1.5"/>
      <circle cx="130" cy="17" r="4" fill="#2563EB"/>
      <text x="141" y="22" class="mono pill-text">PostgreSQL</text>
    </g>

    <g class="float-2" transform="translate(0, 44)">
      <rect x="250" y="0" width="85" height="34" rx="8" fill="#F1F5F9" stroke="#EA580C" stroke-width="1.5"/>
      <circle cx="265" cy="17" r="4" fill="#EA580C"/>
      <text x="276" y="22" class="mono pill-text">Git</text>
    </g>

    <g class="float-3" transform="translate(0, 44)">
      <rect x="345" y="0" width="115" height="34" rx="8" fill="#F1F5F9" stroke="#9333EA" stroke-width="1.5"/>
      <circle cx="360" cy="17" r="4" fill="#9333EA"/>
      <text x="371" y="22" class="mono pill-text">REST API</text>
    </g>
  </g>

  <g transform="translate(500, 525)">
    <text x="0" y="0" class="mono" font-size="14" fill="#0284C7" font-weight="bold">&gt; arvin.initEngine()</text>
    <rect x="180" y="-12" width="10" height="16" class="cursor"/>
  </g>
</svg>
